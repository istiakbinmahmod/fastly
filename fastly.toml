# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = ["istiakmahmod842@gmail.com"]
cloned_from = "https://github.com/fastly/compute-starter-kits/tree/main/starter-kits/javascript/default"
description = "Demo fastly compute project"
language = "javascript"
manifest_version = 3
name = "my-edge-demo"
service_id = "4xcJEpXWuWl4SffL0eAYIo"

[local_server]

  [local_server.backends]

    # Origin site that experiments run against.
    [local_server.backends.github_pages]
      url = "https://istiakbinmahmod.github.io"
      override_host = "istiakbinmahmod.github.io"

    # Optimizely datafile.
    [local_server.backends.optimizely_cdn]
      url = "https://cdn.optimizely.com"

    # Optimizely tracking events.
    [local_server.backends.optimizely_logx]
      url = "https://logx.optimizely.com"

  # Local-only geolocation: `fastly compute serve` sees every client as 127.0.0.1,
  # so pin it to Dhaka to exercise location audiences.
  [local_server.geolocation]
    format = "inline-toml"

    [local_server.geolocation.addresses]

      [local_server.geolocation.addresses."127.0.0.1"]
        city = "Dhaka"
        continent = "AS"
        country_code = "BD"
        region = "13"
        utc_offset = 600

[scripts]
  build = "npm run build"
  post_init = "npm install"
